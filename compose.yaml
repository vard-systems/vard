# Production: Postgres, Redis, the API, and the two apps as Node servers in
# front of it. TLS ends at whatever proxy or load balancer the platform puts in
# front (DEPLOY.md): the apps publish on the host's
# loopback alone, for it, and nothing else publishes at all.
#
#   make docker-env public=https://id.example.com admin=https://admin.example.com
#   make docker-up
#
# Two networks. `edge` is the apps and the API: the apps pass the API's paths
# on, and the API reaches out from it (mail, social and SSO providers,
# back-channel logout). `data` is Postgres and Redis with the API, and is
# internal: no route out, and nothing on it the apps can reach.

name: vard

# Every container's log is capped, so a server that records each sign-in
# cannot fill the disk Postgres is on.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  init: true
  security_opt: ["no-new-privileges:true"]

# The images built here run as an unprivileged user, need no capability and
# write nowhere but /tmp, so they are given none and a read-only filesystem.
x-locked: &locked
  <<: *hardened
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]

# What both apps share. They start once the API answers. Their healthcheck
# asks for a static file, so it says the server is up without rendering a
# page, and filling the API's log, every few seconds.
x-web: &web
  <<: *locked
  depends_on:
    api: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/robots.txt"]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 6
  deploy: { resources: { limits: { memory: 512m, pids: 256 } } }

x-web-environment: &web-environment
  # The header the caller's address is read from, when the infrastructure
  # in front sets one; empty, the connection's own.
  ADDRESS_HEADER: ${APP_ADDRESS_HEADER:-}
  # The API's own limit (middleware.MaxBodyBytes): a body the API would take
  # — a logo, a SAML response — is never refused here first.
  BODY_SIZE_LIMIT: 1M

services:
  postgres:
    <<: *hardened
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vard
      POSTGRES_USER: vard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in compose.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vard -d vard"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 128m
    deploy: { resources: { limits: { pids: 512 } } }
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [data]

  # The cache in front of Postgres, and the rate limit's shared counts.
  # Nothing in it is the only copy of anything, so it keeps nothing on disk.
  # Every cached value and every count expires, and volatile-lru evicts only
  # keys that expire — so when memory runs short it drops cache, never the
  # small generation counters that say which cached values are current.
  redis:
    <<: *hardened
    image: redis:8-alpine
    # A password, because what is in here decides who is signed in: a
    # session put here is believed.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save '''' --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in compose.env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy: { resources: { limits: { memory: 384m, pids: 128 } } }
    networks: [data]

  api:
    <<: *locked
    image: vard-api:${VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args: { VERSION: "${VERSION:-dev}" }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Both listeners, each ready only while its database answers (/readyz;
      # /healthz says only that the process is up).
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://127.0.0.1:8080/readyz && wget -qO /dev/null http://127.0.0.1:8081/readyz",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    # The server gives requests under way 15s to finish (shutdownGrace in
    # cmd/vard/main.go); Docker's own default is 10s, which would SIGKILL
    # it half way through every deploy.
    stop_grace_period: 20s
    deploy: { resources: { limits: { memory: 512m, pids: 256 } } }
    environment:
      VARD_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL in compose.env}
      VARD_ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in compose.env}
      VARD_SECRET_KEY: ${VARD_SECRET_KEY:?set VARD_SECRET_KEY in compose.env}
      # The server runs as vard_app, which reads and writes rows and nothing
      # else; it migrates as vard, the owner, and makes vard_app on the way.
      VARD_DB_DSN: postgres://vard_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in compose.env}@postgres:5432/vard?sslmode=disable
      VARD_DB_MIGRATE_DSN: postgres://vard:${POSTGRES_PASSWORD}@postgres:5432/vard?sslmode=disable
      VARD_REDIS_HOST: redis
      VARD_REDIS_PORT: 6379
      VARD_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # A second factor for administrators: required unless compose.env says
      # optional. After the first start the setting lives in the database.
      VARD_ADMIN_MFA: ${VARD_ADMIN_MFA:-required}
      # A test setup's escape from refusing plain http and a weak key; the
      # server warns of it at every start.
      VARD_ALLOW_INSECURE_HTTP: ${VARD_ALLOW_INSECURE_HTTP:-false}
      VARD_RATE_LIMIT: ${VARD_RATE_LIMIT:-20}
      VARD_LOG_LEVEL: ${VARD_LOG_LEVEL:-info}
      # Only the two apps forward a caller's address, from their fixed
      # addresses below — not the whole subnet, which is also the API.
      VARD_TRUSTED_PROXIES: 172.30.0.2/32,172.30.0.3/32
      VARD_SMTP_HOST: ${VARD_SMTP_HOST:-}
      VARD_SMTP_PORT: ${VARD_SMTP_PORT:-587}
      VARD_SMTP_USERNAME: ${VARD_SMTP_USERNAME:-}
      VARD_SMTP_PASSWORD: ${VARD_SMTP_PASSWORD:-}
      VARD_SMTP_FROM: ${VARD_SMTP_FROM:-}
    networks: [edge, data]

  # The users' site: the sign-in pages, with the provider and the account API
  # passed on to the public listener.
  id:
    <<: *web
    image: vard-id:${VERSION:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { APP: web/id, VERSION: "${VERSION:-dev}", ORIGIN: "${PUBLIC_URL}" }
    environment:
      <<: *web-environment
      API_URL: http://api:8080
    ports: ["${ID_PUBLISH:-127.0.0.1:3000}:3000"]
    networks:
      edge: { ipv4_address: 172.30.0.2 }

  # The staff site: the panel, with the admin API passed on to the admin
  # listener.
  console:
    <<: *web
    image: vard-console:${VERSION:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { APP: web/console, VERSION: "${VERSION:-dev}", ORIGIN: "${ADMIN_URL}" }
    environment:
      <<: *web-environment
      API_URL: http://api:8081
    ports: ["${CONSOLE_PUBLISH:-127.0.0.1:3001}:3000"]
    networks:
      edge: { ipv4_address: 172.30.0.3 }

networks:
  edge:
    ipam:
      config:
        # The apps get .2 and .3 by name above; everything else is handed an
        # address out of the upper half, so a dynamic one can never land on
        # an address the API trusts.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
  data:
    internal: true

volumes:
  postgres:
