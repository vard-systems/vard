# What both Vard sites send on to their app. Installed beside the site's
# configuration as /etc/nginx/vard-proxy.conf (see deploy/README.md).

proxy_http_version 1.1;
# Keep-alive to the upstream: no hop-by-hop Connection header passed on.
proxy_set_header Connection "";

# Who is calling, as this proxy saw them, overwriting anything a client sent:
# the apps read X-Real-IP (ADDRESS_HEADER in deploy/compose.yaml), and nothing
# before this proxy is believed, so X-Forwarded-For is replaced, not appended.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";

# The apps answer with their own addresses; nothing to rewrite.
proxy_redirect off;

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
