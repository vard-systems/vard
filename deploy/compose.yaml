# Production: Postgres, Redis, the API, and the two apps as Node servers in
# front of it, over plain http. Only the apps publish ports: each renders its
# pages and passes the API's paths on. See the repository README.
#
#   cp deploy/.env.example deploy/.env    # fill it in
#   make docker-up

name: vard

# Every container's log is capped, so a server that records each sign-in
# cannot fill the disk Postgres is on.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]

# What both apps share. They start once the API answers. Their healthcheck
# asks for a static file, so it says the server is up without rendering a
# page, and filling the API's log, every few seconds.
x-web: &web
  <<: *hardened
  depends_on:
    api: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/favicon.svg"]
    interval: 5s
    timeout: 3s
    retries: 24

services:
  postgres:
    <<: *hardened
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vard
      POSTGRES_USER: vard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: pg_isready -U vard
      interval: 2s
      retries: 30
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [internal]

  # The cache in front of Postgres, and the rate limit's shared counts.
  # Nothing in it is the only copy of anything, so it keeps nothing on disk.
  # Every cached value and every count expires, and volatile-lru evicts only
  # keys that expire — so when memory runs short it drops cache, never the
  # small generation counters that say which cached values are current.
  redis:
    <<: *hardened
    image: redis:8-alpine
    # A password, because what is in here decides who is signed in: a
    # session put here is believed. Anything else on the network that was
    # taken over — the proxy, say — could otherwise write one.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save '''' --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 2s
      retries: 30
    networks: [internal]

  api:
    <<: *hardened
    build:
      {
        context: ..,
        dockerfile: deploy/docker/api.Dockerfile,
        args: { VERSION: "${VERSION:-dev}" },
      }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Both listeners: either one failing to come up is a broken deployment.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz && wget -qO- http://127.0.0.1:8081/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
    # The server gives requests under way 15s to finish (shutdownGrace in
    # cmd/vard/main.go); Docker's own default is 10s, which would SIGKILL
    # it half way through every deploy.
    stop_grace_period: 20s
    environment:
      VARD_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      VARD_ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in deploy/.env}
      VARD_SECRET_KEY: ${VARD_SECRET_KEY:?set VARD_SECRET_KEY in deploy/.env}
      VARD_DB_DSN: postgres://vard:${POSTGRES_PASSWORD}@postgres:5432/vard?sslmode=disable
      VARD_REDIS_HOST: redis
      VARD_REDIS_PORT: 6379
      VARD_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # A second factor for every administrator. The server's own default is
      # optional, so that a fresh installation can be got into at all; a
      # deployment that is going to face the internet starts the other way.
      # After the first start the setting lives in the database.
      VARD_ADMIN_MFA: ${VARD_ADMIN_MFA:-required}
      VARD_RATE_LIMIT: ${VARD_RATE_LIMIT:-20}
      VARD_LOG_LEVEL: ${VARD_LOG_LEVEL:-info}
      # Only the two apps forward a caller's address, from their fixed
      # addresses below — not the whole subnet, which is also Postgres and
      # Redis.
      VARD_TRUSTED_PROXIES: 172.30.0.2/32,172.30.0.3/32
      VARD_SMTP_HOST: ${VARD_SMTP_HOST:-}
      VARD_SMTP_PORT: ${VARD_SMTP_PORT:-587}
      VARD_SMTP_USERNAME: ${VARD_SMTP_USERNAME:-}
      VARD_SMTP_PASSWORD: ${VARD_SMTP_PASSWORD:-}
      VARD_SMTP_FROM: ${VARD_SMTP_FROM:-}
    networks: [internal]

  # The users' site: the sign-in pages, with the provider and the account API
  # passed on to the public listener.
  id:
    <<: *web
    build:
      {
        context: ..,
        dockerfile: deploy/docker/web.Dockerfile,
        args: { APP: web/id },
      }
    environment:
      API_URL: http://api:8080
    ports: ["8080:3000"]
    networks:
      internal: { ipv4_address: 172.30.0.2 }

  # The staff site: the panel, with the admin API passed on to the admin
  # listener. Published on this machine's loopback only, so the panel and the
  # admin API are not on the network; reach it over an SSH tunnel
  # (ssh -L 8081:localhost:8081 server).
  console:
    <<: *web
    build:
      {
        context: ..,
        dockerfile: deploy/docker/web.Dockerfile,
        args: { APP: web/console },
      }
    environment:
      API_URL: http://api:8081
    ports: ["127.0.0.1:8081:3000"]
    networks:
      internal: { ipv4_address: 172.30.0.3 }

networks:
  internal:
    ipam:
      config:
        # The apps get .2 and .3 by name above; everything else is handed an
        # address out of the upper half, so a dynamic one can never land on
        # an address the API trusts.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  postgres:
