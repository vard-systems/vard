# Production: Postgres, Redis, and the API — one binary that also serves the
# id app and the console, compiled into it — over plain http. Only the API
# publishes ports. See the repository README.
#
#   cp deploy/.env.example deploy/.env    # fill it in
#   make deploy-up

name: loginer

# Every container's log is capped, so a server that records each sign-in
# cannot fill the disk Postgres is on.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *hardened
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loginer
      POSTGRES_USER: loginer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: pg_isready -U loginer
      interval: 2s
      retries: 30
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [internal]

  # The cache in front of Postgres, and the rate limit's shared counts.
  # Nothing in it is the only copy of anything, so it keeps nothing on disk.
  # Every cached value and every count expires, and volatile-lru evicts only
  # keys that expire — so when memory runs short it drops cache, never the
  # small generation counters that say which cached values are current.
  redis:
    <<: *hardened
    image: redis:8-alpine
    # A password, because what is in here decides who is signed in: a
    # session put here is believed. Anything else on the network that was
    # taken over — the proxy, say — could otherwise write one.
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save '''' --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass "$$REDIS_PASSWORD"',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 2s
      retries: 30
    networks: [internal]

  api:
    <<: *hardened
    build:
      {
        context: ..,
        dockerfile: deploy/docker/api.Dockerfile,
        args: { VERSION: "${VERSION:-dev}" },
      }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Both listeners: either one failing to come up is a broken deployment.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz && wget -qO- http://127.0.0.1:8081/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
    # The server gives requests under way 15s to finish (shutdownGrace in
    # cmd/loginer/main.go); Docker's own default is 10s, which would SIGKILL
    # it half way through every deploy.
    stop_grace_period: 20s
    # 8080 is the id app with the provider and the account API; 8081 the
    # console with the admin API, published on this machine's loopback only,
    # so the admin API is not on the network. Reach it over an SSH tunnel
    # (ssh -L 8081:localhost:8081 server).
    ports: ["8080:8080", "127.0.0.1:8081:8081"]
    environment:
      LOGINER_ISSUER: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
      LOGINER_ADMIN_URL: ${ADMIN_URL:?set ADMIN_URL in deploy/.env}
      LOGINER_SECRET_KEY: ${LOGINER_SECRET_KEY:?set LOGINER_SECRET_KEY in deploy/.env}
      LOGINER_DB_DSN: postgres://loginer:${POSTGRES_PASSWORD}@postgres:5432/loginer?sslmode=disable
      LOGINER_REDIS_HOST: redis
      LOGINER_REDIS_PORT: 6379
      LOGINER_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # A second factor for every administrator. The server's own default is
      # optional, so that a fresh installation can be got into at all; a
      # deployment that is going to face the internet starts the other way.
      # After the first start the setting lives in the database.
      LOGINER_ADMIN_MFA: ${LOGINER_ADMIN_MFA:-required}
      LOGINER_RATE_LIMIT: ${LOGINER_RATE_LIMIT:-20}
      # Nothing is in front of the API, so no one may say who the caller is.
      # A proxy put in front later is listed here, and never a whole range.
      LOGINER_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOGINER_SMTP_HOST: ${LOGINER_SMTP_HOST:-}
      LOGINER_SMTP_PORT: ${LOGINER_SMTP_PORT:-587}
      LOGINER_SMTP_USERNAME: ${LOGINER_SMTP_USERNAME:-}
      LOGINER_SMTP_PASSWORD: ${LOGINER_SMTP_PASSWORD:-}
      LOGINER_SMTP_FROM: ${LOGINER_SMTP_FROM:-}
    networks: [internal]

networks:
  internal:

volumes:
  postgres:
